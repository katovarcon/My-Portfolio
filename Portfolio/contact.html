<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Mi Portafolio</div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="work.html">Work</a></li>
        <li><a href="contact.html" class="active">Contacto</a></li>
      </ul>
      <button class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
      </button>
      <button class="dark-btn" id="darkBtn">🌙</button>
    </nav>
  </header>

  <section class="contact fade-in">
    <div class="contact-box">
      <h2 class="contact-title">✱ CONTACT</h2>
      <h3 class="contact-subtitle">Got a project in mind?<br>Let's get in touch.</h3>
  
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name *" required>
        </div>
  
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Email address *" required>
        </div>
  
        <div class="form-group full-width">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Tell me about your project *" required></textarea>
        </div>
  
        <div class="form-submit">
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
  </section>
  

  <footer>
    <div class="footer-top">
      <p>Yay! We have come to the end. Say 👋</p>
      <a href="mailto:tuemail@gmail.com" class="footer-email">k.tovarcontreras@gmail.com</a>
    </div>
    <div class="footer-links">
      <a href="#">LinkedIn</a>
      <a href="#">Discord</a>
      <a href="#">Mail</a>
    </div>
    <div class="footer-meta">
      <p>Made by <a href="#">Karla Tovar</a></p>
      <p>Septiembre 2025</p>
    </div>
    <div class="footer-end">
      <h2>[The End]</h2>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
